<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EyeCare AI | Project by Sonam</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* === CSS / STYLING === */
        :root {
            --bg-color: #0b0f19;
            --accent-glow: #00f2fe;
            --secondary-glow: #4facfe;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --card-bg: rgba(16, 23, 40, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            overflow-x: hidden; display: flex; flex-direction: column;
            align-items: center; min-height: 100vh;
            background-image: radial-gradient(circle at top, #111a2f 0%, var(--bg-color) 70%);
        }

        nav {
            width: 100%; padding: 20px 50px; display: flex;
            justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(0, 242, 254, 0.2); backdrop-filter: blur(10px);
        }

        .logo { font-size: 24px; font-weight: bold; color: var(--accent-glow); text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
        
        .hero { display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 40px; padding: 0 20px; width: 100%; max-width: 800px;}
        .hero h1 { font-size: 3rem; margin-bottom: 10px; background: linear-gradient(to right, var(--secondary-glow), var(--accent-glow)); -webkit-background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(0, 242, 254, 0.3); }
        .hero p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 30px; }

        /* Eye Animation */
        .eye-container { position: relative; width: 120px; height: 120px; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; animation: float 4s ease-in-out infinite;}
        .eye { position: relative; width: 110px; height: 110px; background: #fff; border-radius: 50%; box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 30px rgba(0, 242, 254, 0.4); overflow: hidden; border: 4px solid var(--accent-glow); }
        .iris { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; background: radial-gradient(circle, var(--accent-glow) 0%, #005f73 70%, #001219 100%); border-radius: 50%; transition: transform 0.1s ease-out; }
        .pupil { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; background: #000; border-radius: 50%; }
        
        /* Cards */
        .upload-card, .result-card {
            background: var(--card-bg); border: 1px solid rgba(0, 242, 254, 0.2); border-radius: 20px;
            padding: 30px; width: 100%; text-align: center; backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: all 0.3s;
        }

        .drop-zone { border: 2px dashed rgba(0, 242, 254, 0.5); border-radius: 15px; padding: 40px 20px; cursor: pointer; transition: all 0.3s ease; }
        .drop-zone.dragover { background: rgba(0, 242, 254, 0.1); border-color: var(--accent-glow); transform: scale(1.02); }
        .drop-zone i { font-size: 40px; color: var(--accent-glow); margin-bottom: 10px; display: block; }
        input[type="file"] { display: none; }

        .btn-primary { margin-top: 20px; background: linear-gradient(45deg, var(--secondary-glow), var(--accent-glow)); color: #000; border: none; padding: 12px 30px; border-radius: 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: transform 0.3s; }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 242, 254, 0.4); }

        .btn-pdf { background: linear-gradient(45deg, #ff416c, #ff4b2b); margin-left: 10px; }

        /* Results Section (Hidden by default) */
        .result-card { display: none; margin-top: 30px; text-align: left; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 10px; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .detected { color: #ff4b2b; font-weight: bold; }
        .clear { color: #00f2fe; }

        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <nav>
        <div class="logo">👁️ EyeCare AI</div>
        <div style="color: var(--text-muted);">Developed by Sonam</div>
    </nav>

    <div class="hero">
        <div class="eye-container">
            <div class="eye"><div class="iris" id="iris"><div class="pupil"></div></div></div>
        </div>

        <h1>Retinal Disease Detection</h1>
        <p>Upload a fundus image. Our AI analyzes 8 different eye conditions instantly.</p>
        
        <div class="upload-card">
            <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <i>📥</i>
                <p>Drag & Drop eye image here<br>or click to browse</p>
                <input type="file" id="file-input" accept="image/*">
            </div>
            <button class="btn-primary" id="scan-btn">Start AI Scan 🚀</button>
        </div>

        <div class="result-card" id="result-card">
            <h2 style="margin-bottom: 15px; color: var(--accent-glow); text-align: center;">🩺 Diagnosis Report</h2>
            <div id="results-list"></div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn-primary btn-pdf" id="pdf-btn">Download PDF Report 📄</button>
            </div>
        </div>
    </div>

    <script>
        // Eye Tracking Logic
        const eye = document.querySelector('.eye');
        const iris = document.getElementById('iris');
        document.addEventListener('mousemove', (e) => {
            const eyeRect = eye.getBoundingClientRect();
            const deltaX = e.clientX - (eyeRect.left + eyeRect.width / 2);
            const deltaY = e.clientY - (eyeRect.top + eyeRect.height / 2);
            const angle = Math.atan2(deltaY, deltaX);
            const distance = Math.min(Math.hypot(deltaX, deltaY) / 10, 25);
            iris.style.transform = `translate(calc(-50% + ${Math.cos(angle)*distance}px), calc(-50% + ${Math.sin(angle)*distance}px))`;
        });

        // File Upload Logic
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const scanBtn = document.getElementById('scan-btn');
        const resultCard = document.getElementById('result-card');
        const resultsList = document.getElementById('results-list');
        const pdfBtn = document.getElementById('pdf-btn');
        let globalResults = {}; // Store results for PDF

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if(e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; handleFile(); }
        });
        fileInput.addEventListener('change', handleFile);

        function handleFile() {
            if(fileInput.files.length) {
                dropZone.innerHTML = `<i>✅</i><p style="color: var(--accent-glow);">Image Selected: <b>${fileInput.files[0].name}</b></p>`;
                resultCard.style.display = "none";
            }
        }

        // API Call to FastAPI Backend
        scanBtn.addEventListener('click', async () => {
            if(!fileInput.files.length) return alert("Please upload an image first!");
            
            scanBtn.innerHTML = "Analyzing... ⚙️";
            scanBtn.disabled = true;

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            try {
                // UPDATE: Changed local URL to your live Render backend
                const response = await fetch("https://eye-disease-detection-9qg2.onrender.com/predict", { method: "POST", body: formData });
                const data = await response.json();
                globalResults = data;

                // Build HTML Result List
                resultsList.innerHTML = "";
                for (const [disease, info] of Object.entries(data)) {
                    const statusClass = info.detected ? 'detected' : 'clear';
                    const statusText = info.detected ? '🚨 DETECTED' : '✅ Clear';
                    resultsList.innerHTML += `
                        <div class="result-item">
                            <span>${disease}</span>
                            <span class="${statusClass}">${info.percentage}% - ${statusText}</span>
                        </div>`;
                }

                resultCard.style.display = "block";
                scanBtn.innerHTML = "Scan Another Image 🔄";

            } catch (error) {
                alert("Error connecting to AI Server. Please try again in a moment.");
                scanBtn.innerHTML = "Start AI Scan 🚀";
            }
            scanBtn.disabled = false;
        });

        // PDF Generation Logic (Sonam's special feature!)
        pdfBtn.addEventListener('click', () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Header
            doc.setFontSize(22);
            doc.setTextColor(0, 102, 204);
            doc.text("EyeCare AI - Medical Report", 105, 20, null, null, "center");
            
            doc.setFontSize(12);
            doc.setTextColor(100, 100, 100);
            doc.text("Advanced Retinal Disease Screening System", 105, 28, null, null, "center");
            
            doc.setLineWidth(0.5);
            doc.line(20, 35, 190, 35);

            // Patient/Doctor Info
            doc.setFontSize(12);
            doc.setTextColor(0, 0, 0);
            const date = new Date().toLocaleDateString();
            doc.text(`Date of Scan: ${date}`, 20, 45);
            doc.text(`Analyzed Image: ${fileInput.files[0].name}`, 20, 52);
            doc.setFont(undefined, 'bold');
            doc.text(`Consulting AI Engineer: Sonam`, 20, 65); // <-- Sonam's Name Here!
            doc.setFont(undefined, 'normal');

            // Results Table
            doc.text("--- AI DIAGNOSIS RESULTS ---", 20, 80);
            let yPos = 90;
            
            for (const [disease, info] of Object.entries(globalResults)) {
                let status = info.detected ? "DETECTED (High Risk)" : "Clear (Low Risk)";
                if(info.detected) {
                    doc.setTextColor(200, 0, 0); // Red for detected
                    doc.setFont(undefined, 'bold');
                } else {
                    doc.setTextColor(0, 100, 0); // Green for clear
                    doc.setFont(undefined, 'normal');
                }
                
                doc.text(`${disease}: ${info.percentage}% -> ${status}`, 25, yPos);
                yPos += 10;
            }

            // Footer Disclaimer
            doc.setTextColor(100, 100, 100);
            doc.setFontSize(10);
            doc.text("Disclaimer: This is an AI generated report for screening purposes.", 105, 280, null, null, "center");
            doc.text("Please consult a certified ophthalmologist for clinical verification.", 105, 285, null, null, "center");

            // Download
            doc.save(`EyeCare_Report_${Date.now()}.pdf`);
        });
    </script>
</body>
</html>
